<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor de Documentos · Sattva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root {
  --bg: #f5f4f0; --surface: #fff; --surface2: #f0ede8;
  --border: #e2ddd8; --text: #1a1916; --muted: #7a756e; --faint: #b0aa9f;
  --accent: #2d6a4f; --accent-light: #e8f4ef; --accent-dark: #1a4032;
  --info-bg: #eef2fb; --info: #2455a0;
  --danger: #c94040; --danger-bg: #fdf0f0;
  --r: 10px; --rs: 6px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }

/* LOGIN */
#login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.login-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 48px 40px; width: 360px; text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
.login-logo { width: 52px; height: 52px; background: var(--accent); border-radius: 14px; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; }
.login-logo svg { width: 28px; height: 28px; fill: white; }
.login-card h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
.login-card p { font-size: 13px; color: var(--muted); margin-bottom: 32px; line-height: 1.6; }
.btn-ms { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 13px 20px; background: var(--accent); color: white; border: none; border-radius: var(--r); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.15s; }
.btn-ms:hover { background: #245840; }
.btn-ms:disabled { opacity: 0.6; cursor: not-allowed; }
.login-err { margin-top: 14px; font-size: 12px; color: var(--danger); display: none; }
.login-foot { margin-top: 20px; font-size: 11px; color: var(--faint); }

/* APP */
#app { display: none; }
.topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
.topbar-left { display: flex; align-items: center; gap: 10px; }
.logo-mark { width: 32px; height: 32px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.logo-mark svg { width: 18px; height: 18px; fill: white; }
.topbar h2 { font-size: 14px; font-weight: 600; }
.topbar-sub { font-size: 12px; color: var(--muted); }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.user-pill { display: flex; align-items: center; gap: 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px 4px 4px; font-size: 12px; color: var(--muted); }
.avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: white; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; }
.btn-out { background: none; border: 1px solid var(--border); border-radius: var(--rs); padding: 5px 10px; font-family: 'DM Sans', sans-serif; font-size: 12px; color: var(--muted); cursor: pointer; }
.btn-out:hover { background: var(--surface2); }

.main { max-width: 900px; margin: 0 auto; padding: 28px 24px; }
.stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 24px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px 18px; }
.stat-lbl { font-size: 11px; font-weight: 500; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
.stat-val { font-size: 28px; font-weight: 300; font-family: 'DM Mono', monospace; }
.stat-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

.toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.search { flex: 1; min-width: 180px; position: relative; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--faint); }
.search input { width: 100%; padding: 8px 12px 8px 32px; border: 1px solid var(--border); border-radius: var(--rs); font-family: 'DM Sans', sans-serif; font-size: 13px; background: var(--surface); color: var(--text); outline: none; }
.search input:focus { border-color: var(--accent); }
select { padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--rs); font-family: 'DM Sans', sans-serif; font-size: 13px; background: var(--surface); color: var(--text); outline: none; cursor: pointer; }
.btn-ref { display: flex; align-items: center; gap: 7px; padding: 8px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--rs); font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text); cursor: pointer; white-space: nowrap; }
.btn-ref:hover { background: var(--surface2); }
.btn-ref svg { width: 14px; height: 14px; }
.btn-ref.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.mes-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.mes-titulo { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.live { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--accent); font-weight: 500; }
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

.doc-list { display: flex; flex-direction: column; gap: 6px; }
.doc-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 16px; display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; cursor: pointer; text-decoration: none; color: inherit; transition: border-color .15s; }
.doc-card:hover { border-color: var(--accent); }
.doc-card.novo { border-left: 3px solid var(--accent); }
.doc-icon { width: 40px; height: 40px; border-radius: var(--rs); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.doc-icon svg { width: 22px; height: 22px; }
.doc-body { overflow: hidden; }
.doc-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
.doc-meta { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--muted); }
.doc-meta svg { width: 11px; height: 11px; }
.doc-right { text-align: right; flex-shrink: 0; }
.doc-date { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; white-space: nowrap; }
.badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 20px; margin-top: 5px; }
.b-hoje { background: var(--accent-light); color: var(--accent-dark); }
.b-mes { background: var(--info-bg); color: var(--info); }


.zip-panel { grid-column: 2 / 4; margin-top: -4px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--rs); padding: 10px 12px; font-size: 12px; color: var(--muted); }
.zip-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.zip-title { font-weight: 600; color: var(--text); }
.zip-files { list-style: none; display: flex; flex-direction: column; gap: 4px; max-height: 180px; overflow: auto; }
.zip-files li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: 'DM Mono', monospace; font-size: 11px; padding: 3px 0; border-bottom: 1px solid rgba(0,0,0,0.04); }
.zip-btn { margin-top: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 20px; padding: 3px 9px; font-family: 'DM Sans', sans-serif; font-size: 10px; font-weight: 600; cursor: pointer; }
.zip-btn:hover { border-color: var(--accent); color: var(--accent-dark); }
.zip-err { color: var(--danger); }

.empty { text-align: center; padding: 48px 24px; color: var(--muted); }
.empty svg { width: 40px; height: 40px; margin: 0 auto 12px; display: block; color: var(--faint); }
.empty strong { display: block; font-size: 15px; color: var(--text); margin-bottom: 6px; }

.err-bar { background: var(--danger-bg); border: 1px solid #f0c0c0; border-radius: var(--rs); padding: 10px 14px; font-size: 13px; color: var(--danger); margin-bottom: 16px; display: none; }
.footer-bar { margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 11px; color: var(--faint); }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <svg viewBox="0 0 24 24"><path d="M3 7c0-1.1.9-2 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7zm2 0v2h14V7H5zm0 4v6h14v-6H5z"/></svg>
    </div>
    <h1>Monitor de Documentos</h1>
    <p>Acompanhe em tempo real os documentos recebidos no SharePoint da empresa.</p>
    <button class="btn-ms" id="btn-login" onclick="login()">
      <svg viewBox="0 0 21 21" width="18" height="18">
        <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
        <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
        <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
        <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
      </svg>
      Entrar com Microsoft
    </button>
    <div class="login-err" id="login-err"></div>
    <p class="login-foot">Apenas contas autorizadas da Sattva Controladoria</p>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="topbar-left">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24"><path d="M3 7c0-1.1.9-2 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7zm2 0v2h14V7H5zm0 4v6h14v-6H5z"/></svg>
      </div>
      <h2>Monitor de Documentos</h2>
      <span class="topbar-sub" id="mes-top"></span>
    </div>
    <div class="topbar-right">
      <div class="user-pill">
        <div class="avatar" id="av">?</div>
        <span id="uname">...</span>
      </div>
      <button class="btn-out" onclick="logout()">Sair</button>
    </div>
  </div>

  <div class="main">
    <div class="stats">
      <div class="stat"><div class="stat-lbl">No mês</div><div class="stat-val" id="s1">—</div><div class="stat-sub" id="s1b">—</div></div>
      <div class="stat"><div class="stat-lbl">Hoje</div><div class="stat-val" id="s2">—</div><div class="stat-sub">documentos recebidos</div></div>
      <div class="stat"><div class="stat-lbl">Pastas</div><div class="stat-val" id="s3">—</div><div class="stat-sub">com documentos</div></div>
    </div>

    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="f-nome" placeholder="Buscar documento..." oninput="render()">
      </div>
      <select id="f-pasta" onchange="render()"><option value="">Todas as pastas</option></select>
      <button class="btn-ref" id="btn-ref" onclick="carregar()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        Atualizar
      </button>
    </div>

    <div class="err-bar" id="err-bar"></div>

    <div class="mes-bar">
      <span class="mes-titulo" id="mes-titulo">—</span>
      <span class="live"><span class="live-dot"></span>Ao vivo · 5 min</span>
    </div>

    <div class="doc-list" id="lista">
      <div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><strong>Carregando...</strong></div>
    </div>

    <div class="footer-bar">
      <span id="ft-upd">—</span>
      <span id="ft-tot">—</span>
    </div>
  </div>
</div>

<script>
var CLIENT_ID = '55d2b29e-1284-48c1-ae0a-fb8a8038901c';
var TENANT_ID = '4d6551db-5904-4d24-98c4-f8703bcef62f';
var REDIRECT_URI = 'https://cristhianoribeiro.github.io/monitor-documentos/monitor-documentos.html';
var SCOPES = ['https://graph.microsoft.com/Files.Read.All','https://graph.microsoft.com/Sites.Read.All','https://graph.microsoft.com/User.Read'];
var PASTA = 'Documentos';

var docs = [];
var pastasHistorico = [];
var timer = null;

function competenciaKey(){
  var n = new Date();
  return n.getFullYear() + '_' + String(n.getMonth()+1).padStart(2,'0');
}
var STORAGE_KEY = 'monitor_docs_v2_' + competenciaKey();
var PASTAS_KEY = 'monitor_pastas_v2_' + competenciaKey();

// ── PERSISTÊNCIA LOCAL ──
function carregarSalvos(){
  try{
    docs = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  }catch(e){
    docs = [];
  }

  try{
    pastasHistorico = JSON.parse(localStorage.getItem(PASTAS_KEY) || '[]');
  }catch(e){
    pastasHistorico = [];
  }

  // Garante que as pastas/empresas dos documentos já salvos continuem aparecendo.
  docs.forEach(function(d){
    if(d && d.pasta && pastasHistorico.indexOf(d.pasta) === -1){
      pastasHistorico.push(d.pasta);
    }
  });
}

function salvarDocs(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(docs));
    localStorage.setItem(PASTAS_KEY, JSON.stringify(pastasHistorico));
  }catch(e){}
}

function chaveDoc(d){
  return d.url || (d.nome + '|' + d.data);
}

function mesclarDocs(novos){
  var mapa = {};

  docs.forEach(function(d){
    if(d && chaveDoc(d)) mapa[chaveDoc(d)] = d;
    if(d && d.pasta && pastasHistorico.indexOf(d.pasta) === -1) pastasHistorico.push(d.pasta);
  });

  novos.forEach(function(d){
    if(d && chaveDoc(d)) mapa[chaveDoc(d)] = d;
    if(d && d.pasta && pastasHistorico.indexOf(d.pasta) === -1) pastasHistorico.push(d.pasta);
  });

  // IMPORTANTE: não substitui a base pelo retorno atual do Graph.
  // O Graph Search pode retornar só parte dos itens em uma atualização.
  // Aqui mantemos tudo que já foi visto no mês e só adicionamos/atualizamos novos itens.
  docs = Object.values(mapa)
    .filter(function(d){ return d && d.data && isMes(d.data); })
    .sort(function(a,b){ return new Date(b.data) - new Date(a.data); });

  pastasHistorico = pastasHistorico
    .filter(function(p){ return p && String(p).trim(); })
    .filter(function(p, i, arr){ return arr.indexOf(p) === i; })
    .sort();

  salvarDocs();
}

function limparHistoricoMonitor(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(PASTAS_KEY);
  docs = [];
  pastasHistorico = [];
  atualizarUI();
}

// ── UTILS ──
function ext(n){ return (n.split('.').pop()||'').toLowerCase(); }
function icone(n){
  var e=ext(n);
  var map={pdf:'#E24B4A',xlsx:'#2d7a3a',xls:'#2d7a3a',docx:'#2455a0',doc:'#2455a0',csv:'#0F6E56',zip:'#b97a1a',pptx:'#993556'};
  var c=map[e]||'#888';
  return '<div style="background:'+c+'18;width:40px;height:40px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg viewBox="0 0 24 24" fill="none" stroke="'+c+'" stroke-width="1.5" width="22" height="22"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>';
}
function fmtDate(iso){
  var d=new Date(iso);
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function isHoje(iso){
  var d=new Date(iso),n=new Date();
  return d.getDate()===n.getDate()&&d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();
}
function isMes(iso){
  var d=new Date(iso),n=new Date();
  return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();
}
function pasta(url){
  try{
    var p=decodeURIComponent(url).split('/');
    var i=p.map(function(x){return x.toLowerCase();}).lastIndexOf(PASTA.toLowerCase());
    if(i>-1&&p[i+1])return p[i+1];
  }catch(e){}
  return 'Outros';
}
function initials(n){ if(!n)return '?'; var p=n.trim().split(' '); return (p[0][0]+(p[1]?p[1][0]:'')).toUpperCase(); }
function isZipNome(n){ return ext(n)==='zip'; }
function esc(v){
  return String(v||'').replace(/[&<>'"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c];
  });
}
function encKey(d){ return encodeURIComponent(chaveDoc(d)); }
function getDocPorKey(k){
  var key=decodeURIComponent(k);
  return docs.find(function(d){ return chaveDoc(d)===key; });
}


// ── AUTH com PKCE manual ──
function b64url(buf){
  return btoa(String.fromCharCode.apply(null,new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}
async function gerarChallenge(){
  var arr=new Uint8Array(32);
  crypto.getRandomValues(arr);
  var verifier=b64url(arr);
  var hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier));
  var challenge=b64url(hash);
  return {verifier,challenge};
}

async function login(){
  var btn=document.getElementById('btn-login');
  btn.disabled=true; btn.textContent='Aguarde...';
  try{
    var {verifier,challenge}=await gerarChallenge();
    var state=b64url(crypto.getRandomValues(new Uint8Array(16)));
    sessionStorage.setItem('pkce_verifier',verifier);
    sessionStorage.setItem('pkce_state',state);

    var params=new URLSearchParams({
      client_id: CLIENT_ID,
      response_type: 'code',
      redirect_uri: REDIRECT_URI,
      scope: SCOPES.join(' ')+' offline_access',
      state: state,
      code_challenge: challenge,
      code_challenge_method: 'S256',
      prompt: 'select_account'
    });
    window.location.href='https://login.microsoftonline.com/'+TENANT_ID+'/oauth2/v2.0/authorize?'+params.toString();
  }catch(e){
    mostrarErroLogin(e.message);
    btn.disabled=false; btn.textContent='Entrar com Microsoft';
  }
}

async function trocarCodigo(code){
  var verifier=sessionStorage.getItem('pkce_verifier');
  var resp=await fetch('https://login.microsoftonline.com/'+TENANT_ID+'/oauth2/v2.0/token',{
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body: new URLSearchParams({
      client_id: CLIENT_ID,
      grant_type: 'authorization_code',
      code: code,
      redirect_uri: REDIRECT_URI,
      code_verifier: verifier,
      scope: SCOPES.join(' ')+' offline_access'
    })
  });
  if(!resp.ok){ var e=await resp.json(); throw new Error(e.error_description||'Erro ao trocar código'); }
  var data=await resp.json();
  sessionStorage.setItem('access_token', data.access_token);
  sessionStorage.setItem('refresh_token', data.refresh_token||'');
  var exp=Date.now()+(data.expires_in-60)*1000;
  sessionStorage.setItem('token_exp', exp);
  return data.access_token;
}

async function getToken(){
  var token=sessionStorage.getItem('access_token');
  var exp=parseInt(sessionStorage.getItem('token_exp')||'0');
  if(token && Date.now()<exp) return token;

  var refresh=sessionStorage.getItem('refresh_token');
  if(refresh){
    var resp=await fetch('https://login.microsoftonline.com/'+TENANT_ID+'/oauth2/v2.0/token',{
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body: new URLSearchParams({
        client_id: CLIENT_ID,
        grant_type: 'refresh_token',
        refresh_token: refresh,
        scope: SCOPES.join(' ')+' offline_access'
      })
    });
    if(resp.ok){
      var data=await resp.json();
      sessionStorage.setItem('access_token',data.access_token);
      sessionStorage.setItem('refresh_token',data.refresh_token||refresh);
      sessionStorage.setItem('token_exp',Date.now()+(data.expires_in-60)*1000);
      return data.access_token;
    }
  }
  throw new Error('Sessão expirada');
}

function logout(){
  sessionStorage.clear();
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  if(timer)clearInterval(timer);
}

// ── USUÁRIO ──
async function carregarUsuario(token){
  var r=await fetch('https://graph.microsoft.com/v1.0/me',{headers:{Authorization:'Bearer '+token}});
  if(!r.ok)return;
  var u=await r.json();
  var nome=u.displayName||u.userPrincipalName||'Usuário';
  document.getElementById('uname').textContent=nome.split(' ')[0];
  document.getElementById('av').textContent=initials(nome);
}

// ── BUSCA ──
async function carregar(){
  var btn=document.getElementById('btn-ref');
  btn.classList.add('spin');
  document.getElementById('err-bar').style.display='none';
  try{
    var token=await getToken();
    var now=new Date();
    var inicio=new Date(now.getFullYear(),now.getMonth(),1).toISOString();

    var url='https://graph.microsoft.com/v1.0/search/query';
    var body={requests:[{
      entityTypes:['driveItem'],
      query:{queryString:'*'},
      from:0, size:100,
      sortProperties:[{name:'lastModifiedDateTime',isDescending:true}],
      fields:['id','name','webUrl','lastModifiedDateTime','folder','parentReference','@microsoft.graph.downloadUrl']
    }]};

    var r=await fetch(url,{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok)throw new Error('Erro Graph API: '+r.status);
    var data=await r.json();
    var hits=(data.value&&data.value[0]&&data.value[0].hitsContainers&&data.value[0].hitsContainers[0]&&data.value[0].hitsContainers[0].hits)||[];

    var novos=hits
      .map(function(h){return h.resource;})
      .filter(function(r){return r&&!r.folder;})
      .filter(function(r){
        var u=(r.webUrl||'').toLowerCase();
        return u.indexOf('/'+PASTA.toLowerCase()+'/')>-1||u.indexOf('/'+PASTA.toLowerCase())>-1;
      })
      .filter(function(r){return isMes(r.lastModifiedDateTime);})
      .map(function(r){
        var pr=r.parentReference||{};
        return {
          id:r.id||'',
          driveId:pr.driveId||'',
          nome:r.name,
          url:r.webUrl,
          data:r.lastModifiedDateTime,
          pasta:pasta(r.webUrl),
          downloadUrl:r['@microsoft.graph.downloadUrl']||''
        };
      });

    mesclarDocs(novos);
    atualizarUI();
  }catch(e){
    var bar=document.getElementById('err-bar');
    bar.style.display='block';
    bar.textContent='Erro ao buscar documentos: '+e.message;
    if(e.message==='Sessão expirada')logout();
  }
  btn.classList.remove('spin');
}


// ── ZIP ──
async function baixarBlobZip(doc){
  var token=await getToken();

  if(doc.downloadUrl){
    var direto=await fetch(doc.downloadUrl);
    if(direto.ok) return await direto.blob();
  }

  if(doc.driveId && doc.id){
    var url='https://graph.microsoft.com/v1.0/drives/'+encodeURIComponent(doc.driveId)+'/items/'+encodeURIComponent(doc.id)+'/content';
    var resp=await fetch(url,{headers:{Authorization:'Bearer '+token}});
    if(resp.ok) return await resp.blob();
    throw new Error('Não foi possível baixar o ZIP pelo Graph: '+resp.status);
  }

  throw new Error('O Graph não retornou o identificador necessário para abrir este ZIP.');
}

async function toggleZip(key){
  var doc=getDocPorKey(key);
  if(!doc) return;

  if(doc.zipOpen){
    doc.zipOpen=false;
    salvarDocs();
    render();
    return;
  }

  doc.zipOpen=true;

  if(doc.zipFiles && doc.zipFiles.length){
    salvarDocs();
    render();
    return;
  }

  doc.zipStatus='loading';
  doc.zipError='';
  salvarDocs();
  render();

  try{
    if(typeof JSZip==='undefined') throw new Error('Biblioteca JSZip não carregou. Verifique a conexão com a internet.');
    var blob=await baixarBlobZip(doc);
    var zip=await JSZip.loadAsync(blob);
    var arquivos=Object.keys(zip.files).filter(function(nome){ return !zip.files[nome].dir; });
    doc.zipFiles=arquivos.sort();
    doc.zipStatus='done';
  }catch(e){
    doc.zipStatus='error';
    doc.zipError=e.message||'Erro ao abrir ZIP';
  }

  salvarDocs();
  render();
}

function renderZipPanel(d){
  if(!isZipNome(d.nome) || !d.zipOpen) return '';

  if(d.zipStatus==='loading'){
    return '<div class="zip-panel"><div class="zip-head"><span class="zip-title">Lendo arquivos do ZIP...</span></div></div>';
  }

  if(d.zipStatus==='error'){
    return '<div class="zip-panel"><div class="zip-err">Erro ao abrir ZIP: '+esc(d.zipError)+'</div></div>';
  }

  var files=d.zipFiles||[];
  if(!files.length){
    return '<div class="zip-panel"><div class="zip-head"><span class="zip-title">Conteúdo do ZIP</span><span>Nenhum arquivo encontrado</span></div></div>';
  }

  return '<div class="zip-panel">'+
    '<div class="zip-head"><span class="zip-title">Conteúdo do ZIP</span><span>'+files.length+' arquivo'+(files.length!==1?'s':'')+'</span></div>'+
    '<ul class="zip-files">'+files.map(function(f){return '<li title="'+esc(f)+'">'+esc(f)+'</li>';}).join('')+'</ul>'+
    '</div>';
}

function atualizarUI(){
  var now=new Date();
  var mesNome=now.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  mesNome=mesNome.charAt(0).toUpperCase()+mesNome.slice(1);
  document.getElementById('mes-titulo').textContent=mesNome;
  document.getElementById('mes-top').textContent='· '+mesNome;
  document.getElementById('s1b').textContent=mesNome;

  var hoje=docs.filter(function(d){return isHoje(d.data);}).length;
  var pastas=[...new Set(pastasHistorico.concat(docs.map(function(d){return d.pasta;})).filter(Boolean))];
  document.getElementById('s1').textContent=docs.length;
  document.getElementById('s2').textContent=hoje;
  document.getElementById('s3').textContent=pastas.length;

  var sel=document.getElementById('f-pasta');
  var cur=sel.value;
  sel.innerHTML='<option value="">Todas as pastas</option>'+pastas.sort().map(function(p){return '<option value="'+p+'"'+(p===cur?' selected':'')+'>'+p+'</option>';}).join('');

  document.getElementById('ft-upd').textContent='Atualizado às '+now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('ft-tot').textContent=docs.length+' documento'+(docs.length!==1?'s':'')+' encontrado'+(docs.length!==1?'s':'');
  render();
}

function render(){
  var fp=document.getElementById('f-pasta').value.toLowerCase();
  var fn=document.getElementById('f-nome').value.toLowerCase();
  var lista=document.getElementById('lista');
  var f=docs.filter(function(d){return(!fp||String(d.pasta||'').toLowerCase()===fp)&&(!fn||String(d.nome||'').toLowerCase().indexOf(fn)>-1);});

  if(!f.length){
    var now=new Date();
    var mes=now.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
    var nomePasta = fp ? document.getElementById('f-pasta').value : PASTA;
    lista.innerHTML='<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg><strong>Nenhum documento encontrado</strong><p>Sem documentos salvos para <strong>'+esc(nomePasta)+'</strong> em '+esc(mes)+'</p></div>';
    return;
  }

  lista.innerHTML=f.map(function(d){
    var hoje=isHoje(d.data);
    var key=encKey(d);
    var zipBotao='';
    if(isZipNome(d.nome)){
      zipBotao='<button class="zip-btn" onclick="event.preventDefault();event.stopPropagation();toggleZip(\''+key+'\')">'+(d.zipOpen?'Ocultar ZIP':'Ver arquivos do ZIP')+'</button>';
    }

    return '<a class="doc-card'+(hoje?' novo':'')+'" href="'+esc(d.url)+'" target="_blank" rel="noopener">'+
      icone(d.nome)+
      '<div class="doc-body"><div class="doc-name" title="'+esc(d.nome)+'">'+esc(d.nome)+'</div>'+
      '<div class="doc-meta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>'+esc(d.pasta)+'</div>'+zipBotao+'</div>'+
      '<div class="doc-right"><div class="doc-date">'+esc(fmtDate(d.data))+'</div>'+
      '<span class="badge '+(hoje?'b-hoje':'b-mes')+'">'+(hoje?'Hoje':'Este mês')+'</span></div>'+
      renderZipPanel(d)+
      '</a>';
  }).join('');
}

function mostrarErroLogin(msg){
  var el=document.getElementById('login-err');
  el.style.display='block';
  el.textContent='Erro: '+msg;
}

// ── INIT ──
window.addEventListener('load', async function(){
  carregarSalvos();

  var params=new URLSearchParams(window.location.search);
  var code=params.get('code');
  var state=params.get('state');
  var savedState=sessionStorage.getItem('pkce_state');

  if(code && state && state===savedState){
    // Limpar URL
    history.replaceState({},'',window.location.pathname);
    try{
      var token=await trocarCodigo(code);
      document.getElementById('login-screen').style.display='none';
      document.getElementById('app').style.display='block';
      await carregarUsuario(token);
      await carregar();
      timer=setInterval(carregar,5*60*1000);
    }catch(e){
      mostrarErroLogin(e.message);
    }
    return;
  }

  // Sessão existente?
  var token=sessionStorage.getItem('access_token');
  var exp=parseInt(sessionStorage.getItem('token_exp')||'0');
  var refresh=sessionStorage.getItem('refresh_token');
  if((token&&Date.now()<exp)||refresh){
    try{
      var t=await getToken();
      document.getElementById('login-screen').style.display='none';
      document.getElementById('app').style.display='block';
      await carregarUsuario(t);
      await carregar();
      timer=setInterval(carregar,5*60*1000);
      return;
    }catch(e){}
  }
});
</script>
